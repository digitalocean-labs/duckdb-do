#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: docn
      extra_toolchains: python3

  # Mirrors the community extensions build (community/description.yml): DuckDB 2.0
  # tooling, the same vcpkg commit and the same excluded platforms. Catches problems
  # here before a release is submitted there.
  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.0, community pipeline)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: docn
      extra_toolchains: python3
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw"
      # Build every platform the community repository builds (free for public repositories).
      reduced_ci_mode: disabled
